[project]
name = "ai-sub-switch"
version = "0.1.0"
description = "Recover quota-blocked Conductor chats using existing Claude and Codex subscriptions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
requires-python = ">=3.12"

[project.optional-dependencies]
macos = [
  "pyobjc-framework-Cocoa==13.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz==13.0; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices==13.0; sys_platform == 'darwin'",
]

[project.urls]
Repository = "https://github.com/adamwardecki/ai-sub-switch"
Issues = "https://github.com/adamwardecki/ai-sub-switch/issues"
Changelog = "https://github.com/adamwardecki/ai-sub-switch/blob/main/CHANGELOG.md"

[project.scripts]
aisub = "ai_sub_switch.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_sub_switch"]

[tool.hatch.build.targets.wheel.force-include]
"examples/config.toml" = "ai_sub_switch/default-config.toml"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]
